<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paris stats NBA</title>
<style>
/* Palette sombre, typographie système et surfaces sobres. */
  :root {
    color-scheme: dark;
    --background: #08090b;
    --foreground: #f2f2f7;
    --muted-foreground: #a0a2ad;
    --card: #15161b;
    --border: #2b2d35;
    --success: #69dfa0;
    --destructive: #ff858c;
    --warning: #f1ce79;
    --accent: #88b7ff;
    --radius: 22px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 100px; }
  body {
    margin: 0 auto; max-width: 1240px; padding: 48px 32px 64px;
    background: var(--background); color: var(--foreground);
    font-family: var(--font-sans); font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1 { margin: 0 0 10px; font-size: clamp(28px, 4vw, 40px); line-height: 1.2; font-weight: 650; letter-spacing: -.055em; }
  h2 { margin: 32px 0 12px; font-size: 21px; line-height: 1.3; font-weight: 600; letter-spacing: -.035em; }
  h2 .sub { margin-left: 10px; font-weight: 400; letter-spacing: 0; }
  #meta, #maj { font-size: 12px; line-height: 1.7; }
  #maj b { color: #d6d7df; font-weight: 500; }
  .sub, .lbl { color: var(--muted-foreground); font-size: 13px; }
  .num, input { font-variant-numeric: tabular-nums; }
  code { font-family: var(--font-mono); }
  button, input, select, textarea { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button, input, select, textarea { transition: background-color .16s ease, border-color .16s ease, box-shadow .16s ease; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 3px;
  }
  input, select, textarea { color: var(--foreground); background: #101115; border: 1px solid #3a3c46; border-radius: 10px; }
  input:hover, select:hover, textarea:hover { border-color: #646773; }
  input::placeholder, textarea::placeholder { color: #828591; }
  .live { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; margin-left: 12px; padding: 5px 9px; border: 1px solid #274234; border-radius: 999px; background: #13251b; color: var(--success); font-size: 10px; font-weight: 600; letter-spacing: .01em; line-height: 1.2; }
  .live i { width: 6px; height: 6px; background: currentColor; border-radius: 50%; box-shadow: 0 0 8px #69dfa033; }
  .live.late { color: var(--warning); background: #292316; border-color: #51452a; }
  nav.menu { display: flex; gap: 5px; position: sticky; top: 12px; z-index: 5; width: fit-content; max-width: 100%; margin: 28px 0 30px; padding: 5px; border: 1px solid #ffffff14; border-radius: 16px; background: #1b1c22f2; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: 0 8px 28px #00000026; }
  nav.menu button { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 2px; min-height: 42px; padding: 9px 22px; border: 0; border-radius: 11px; background: transparent; color: #adafb9; font-size: 13px; font-weight: 600; }
  nav.menu button:hover { background: #ffffff08; color: var(--foreground); }
  nav.menu button.on { background: #3a3c45; color: #fff; box-shadow: 0 2px 5px #0003, inset 0 1px #ffffff0d; }
  nav.menu .count { font-size: 10px; color: inherit; opacity: .8; margin-left: 3px; }
  .view > h2:first-child { margin-top: 0; }
  .view[hidden], .modal[hidden], .toast[hidden], .tools[hidden], [hidden] { display: none !important; }
  .bank { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0; }
  .bank input { width: 90px; }
  input.odds { width: 76px; padding: 7px 9px; text-align: right; font-size: 14px; }
  .bank span { font-size: 12px; }
  .basis { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 22px 0 18px; color: var(--muted-foreground); font-size: 12px; }
  .basis button, .btn, .seg button, .chips button { min-height: 36px; padding: 8px 13px; border: 1px solid var(--border); border-radius: 10px; background: #1c1d24; color: #d5d6de; font-size: 12px; font-weight: 500; line-height: 1.4; }
  .basis button:hover, .btn:hover, .seg button:hover, .chips button:hover { background: #2b2d36; border-color: #515460; }
  .basis button.on, .chips button.on { color: #b9d5ff; background: #1c304e; border-color: #446b9f; }
  .games { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); }
  .game { min-width: 0; background: var(--card); border: 1px solid #ffffff12; border-radius: var(--radius); padding: 24px; box-shadow: 0 8px 30px #00000018; }
  .game .when { margin-bottom: 14px; color: #b0b2bd; font-size: 11px; font-weight: 500; letter-spacing: .015em; }
  .side { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; align-items: center; padding: 18px 0; }
  .side + .side { border-top: 1px solid var(--border); }
  .side .name { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.35; letter-spacing: -.015em; }
  .side .name img { width: 28px; height: 28px; object-fit: contain; }
  .side .name small { color: var(--muted-foreground); font-size: 11px; font-weight: 400; white-space: nowrap; }
  .side .proj { font-size: 29px; font-weight: 500; letter-spacing: -.05em; line-height: 1.1; }
  .side .line { display: flex; grid-column: 1 / -1; flex-wrap: wrap; align-items: center; gap: 9px 16px; color: var(--muted-foreground); font-size: 12px; }
  .side .line b, .stake { color: #e4e5ed; font-weight: 600; }
  .side .line label { display: inline-flex; align-items: center; gap: 8px; }
  .src { font-size: 11px; }
  .ev { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .pos, .res-W { color: var(--success); }
  .neg, .res-L { color: var(--destructive); }
  .res-W, .res-L { font-weight: 600; }
  .res-P, .res-pending { color: var(--muted-foreground); }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; line-height: 1.5; }
  .badge.yes { color: #a1edbf; background: #1b3a2b; border: 1px solid #315740; }
  .badge.thin { color: #f1d598; background: #332b1b; border: 1px solid #53442b; }
  .badge.no { color: #b1b3bd; background: #23242c; border: 1px solid #363842; }
  .badge.sus { color: #ffc09d; background: #3c291f; border: 1px solid #614333; }
  button.addbet { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; max-width: 100%; padding: 8px 13px; vertical-align: middle; border: 1px solid #48658c; border-radius: 10px; background: #233b5c; color: #c8ddff; font-size: 12px; font-weight: 600; line-height: 1.4; text-align: center; }
  button.addbet:hover { background: #30517d; border-color: #88b7ff; }
  button.addbet:active { background: #192f4c; }
  button.addbet.hot { background: #69dfa0; border-color: #8eeab8; color: #10281b; box-shadow: 0 0 0 3px #69dfa013; }
  button.addbet.hot:hover { background: #91edb9; border-color: #b5f5d0; }
  button.reset { padding: 3px 7px; border: 1px solid #3c3e49; border-radius: 6px; background: transparent; color: #c3c5cf; font-size: 11px; }
  .foot { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: 12px; line-height: 1.8; }
  .mkt { display: block; margin-top: 12px; }
  .mkt .addbet { margin: 6px 0 0 4px; }
  .info { display: block; margin-top: 8px; }
  .tag { display: inline-block; margin-left: 4px; padding: 1px 6px; border: 1px solid #464852; border-radius: 5px; font-size: 10px; line-height: 1.6; }
  .tag.out { color: var(--destructive); background: #ff858c0a; border-color: #694047; }
  .tag.dtd { color: var(--warning); border-color: #665636; }
  .scroll { max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 16px; background: #131419; scrollbar-color: #4b4d58 #15161b; scrollbar-width: thin; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; white-space: nowrap; font-size: 13px; }
  th, td { padding: 14px 16px; text-align: right; border-bottom: 1px solid #282a32; }
  th { color: #a9acb8; background: #1c1d24; font-size: 11px; font-weight: 500; cursor: pointer; user-select: none; }
  th.sorted { color: #b6d3ff; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #ffffff03; }
  td.team { display: flex; align-items: center; gap: 10px; }
  td.team img { width: 24px; height: 24px; object-fit: contain; }
  .plsel { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin: 18px 0; }
  .plsel select { max-width: 100%; min-height: 42px; padding: 8px 12px; font-size: 13px; }
  table.pl td, table.pl th { padding: 12px; }
  table.pl input { width: 64px; min-height: 36px; padding: 7px; text-align: right; font-size: 13px; }
  table.pl tr.out td { opacity: .55; }
  .pname small { color: var(--muted-foreground); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 20px 0 24px; }
  .kpi { padding: 19px 18px; background: var(--card); border: 1px solid #ffffff12; border-radius: 18px; }
  .kpi .l { color: var(--muted-foreground); font-size: 11px; }
  .kpi .v { margin-top: 8px; font-size: 25px; font-weight: 500; letter-spacing: -.04em; line-height: 1.2; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin: 20px 0 12px; }
  .tools textarea { width: 100%; min-height: 110px; padding: 12px; font: 12px/1.6 var(--font-mono); }
  button.del { min-width: 32px; min-height: 32px; border: 0; border-radius: 7px; background: transparent; color: var(--muted-foreground); font-size: 14px; }
  button.del:hover { background: #ff858c12; color: var(--destructive); }
  .empty { margin: 16px 0; padding: 32px; border: 1px dashed #3a3c46; border-radius: 18px; color: var(--muted-foreground); background: #131419; }
  .stale { margin: 16px 0; padding: 14px 18px; border: 1px solid #5e4e2e; border-radius: 14px; color: var(--warning); background: #282216; }
  details { margin-top: 24px; padding: 18px 20px; border: 1px solid var(--border); border-radius: 16px; color: var(--muted-foreground); font-size: 12px; }
  details p { max-width: 80ch; line-height: 1.8; }
  summary { cursor: pointer; color: #c6c8d2; }
  .modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 28px; z-index: 20; background: #0009; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .modal form { display: grid; gap: 14px; width: 100%; max-width: 440px; max-height: calc(100dvh - 56px); overflow-y: auto; padding: 26px; border: 1px solid #3a3c46; border-radius: 26px; background: #1b1c22; box-shadow: 0 32px 100px #0008; }
  .mhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .modal h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.025em; line-height: 1.4; }
  .mhead .x { flex-shrink: 0; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: #30323b; color: #b8bbc6; font-size: 13px; }
  .seg { display: flex; gap: 5px; padding: 4px; border-radius: 13px; background: #101115; }
  .seg button { flex: 1; min-width: 0; min-height: 42px; border: 0; background: transparent; font-size: 12px; }
  .seg button.on { color: white; background: #3a3c46; box-shadow: 0 2px 4px #0003; }
  .modal label { display: grid; min-width: 0; gap: 6px; color: #afb2be; font-size: 12px; }
  .modal input, .modal select { width: 100%; min-width: 0; min-height: 46px; padding: 10px 12px; font-size: 16px; }
  .modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chips button { min-height: 36px; padding: 7px 12px; }
  .msum { padding: 12px 14px; border: 1px solid #343641; border-radius: 12px; background: #ffffff03; color: #d1d3dd; font-size: 12px; line-height: 1.7; }
  .gain { padding: 4px 0; font-size: 14px; }
  .gain b { color: var(--success); }
  .modal .actions { display: flex; gap: 10px; margin-top: 2px; }
  .btn.big { flex: 1; padding: 13px 16px; font-size: 14px; font-weight: 600; }
  .btn.main { background: #8bb9ff; border-color: #8bb9ff; color: #101e35; }
  .btn.main:hover { background: #afcfff; border-color: #afcfff; }
  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 30; display: flex; align-items: center; gap: 12px; width: max-content; max-width: calc(100% - 32px); padding: 14px 18px; border: 1px solid #436c54; border-radius: 16px; background: #222b25; color: #e2f1e6; font-size: 13px; transform: translateX(-50%); box-shadow: 0 12px 48px #0008; }
  @media (max-width: 600px) {
    body { padding: 28px 16px 40px; }
    h1 { font-size: 28px; letter-spacing: -.05em; }
    h2 { margin-top: 26px; font-size: 20px; }
    #meta, #maj { font-size: 11px; }
    .live { margin-left: 7px; font-size: 9px; padding: 4px 7px; }
    nav.menu { top: 8px; width: 100%; gap: 3px; margin: 24px 0; padding: 4px; border-radius: 14px; }
    nav.menu button { flex: 1; min-width: 0; padding: 9px 5px; min-height: 42px; font-size: 12px; border-radius: 10px; }
    nav.menu .count { flex-basis: 100%; margin: 0; font-size: 9px; line-height: 1.25; }
    .basis { gap: 6px; margin: 18px 0 16px; }
    .basis button { padding: 8px 10px; font-size: 11px; }
    .bank { gap: 8px; }
    .bank input { width: 80px; font-size: 16px; }
    .games { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .game { padding: 18px; border-radius: 20px; }
    .side { gap: 10px 8px; padding: 16px 0; }
    .side .name { font-size: 13px; gap: 5px; }
    .side .name img { width: 24px; height: 24px; }
    .side .proj { font-size: 26px; }
    .side .line { gap: 9px 12px; }
    input.odds { font-size: 16px; }
    .foot { font-size: 11px; }
    .scroll { border-radius: 14px; }
    th, td { padding: 12px; }
    table.pl input { font-size: 16px; }
    .plsel select { width: 100%; font-size: 16px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .kpi { padding: 16px; border-radius: 16px; }
    .kpi .v { font-size: 23px; }
    .empty { padding: 24px 20px; }
    .modal { align-items: flex-end; padding: 0; }
    .modal form { width: 100%; max-width: none; max-height: 94dvh; padding: 22px 20px max(24px, env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; border-bottom: 0; gap: 13px; }
    .modal form::before { content: ""; width: 34px; height: 4px; margin: -10px auto 2px; border-radius: 4px; background: #626570; }
    .modal h3 { font-size: 17px; }
    .toast { bottom: max(16px, env(safe-area-inset-bottom)); flex-wrap: wrap; justify-content: center; gap: 8px; padding: 12px 14px; }
    h2 .sub { display: block; margin: 5px 0 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>

<body>
<h1>Paris stats NBA <span class="live" id="live"><i></i><span>En ligne</span></span></h1>
<div class="sub" id="meta"></div>
<div class="sub" id="maj"></div>

<div id="app"></div>

<script src="data.js"></script>
<script src="players.js"></script>
<script src="h2h.js"></script>
<script src="h2hbox.js"></script>
<script>
(function () {
  "use strict";

  // ---- Réglages du modèle ----
  var HOME_EDGE = 2.5;     // avantage du terrain, en points d'écart
  var MARGIN_SD = 12;      // écart-type de l'écart final d'un match NBA
  var SHRINK_GAMES = 6;    // poids de la moyenne de la ligue, en matchs (6 = le plus proche des lignes du marché au test)
  var TOTAL_SD = 18;       // écart-type du total de points d'un match NBA
  // Marge de sécurité : valeur espérée minimale pour dire « ça vaut le coup » (réglable dans la page, 10 % par défaut).
  var EV_GOOD = 0.10;
  try { var mg = parseFloat(localStorage.getItem("paris-stats-marge")); if (isFinite(mg) && mg >= 0 && mg <= 50) EV_GOOD = mg / 100; } catch (e) {}
  // Au-delà, l'écart avec le book vient presque toujours d'une info que le modèle n'a pas.
  var EV_SUSPECT = Math.max(0.15, EV_GOOD + 0.10);
  var STD_DEC = 1.91;      // cote supposée (-110) pour l'écart et le total, ESPN ne les fournit pas
  var KELLY_FRAC = 0.25;   // quart de Kelly
  var MAX_STAKE = 0.03;
  // Stats des joueurs : colonne dans players.js, plancher de l'écart-type, ajustement par la défense adverse.
  var STATS = {
    pts: { i: 6, b: 3, label: "Points", short: "pts", floor: 4, opp: true },
    reb: { i: 7, b: 4, label: "Rebonds", short: "reb", floor: 2 },
    ast: { i: 8, b: 5, label: "Passes", short: "passes", floor: 1.5 },
    tpm: { i: 9, b: 6, label: "Paniers à 3 pts", short: "3 pts", floor: 1 }
  };    // jamais plus de 3 % de la bankroll sur un pari

  var data = window.NBA_DATA;
  var app = document.getElementById("app");
  var meta = document.getElementById("meta");

  if (!data || !data.teams || !data.games) {
    app.innerHTML = '<div class="empty">Aucune donnée. Lance <code>node fetch-data.mjs</code> dans ce dossier, puis recharge la page.</div>';
    return;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function f1(x) { return x.toFixed(1); }
  function pct(x) { return (x * 100).toFixed(0) + " %"; }
  function avg(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : 0; }

  // ---- Statistiques par équipe ----
  var teams = {};
  data.teams.forEach(function (t) { teams[t.id] = { info: t, log: [] }; });

  data.games.slice().sort(function (a, b) { return new Date(a.date) - new Date(b.date); }).forEach(function (g) {
    var h = teams[g.homeId], a = teams[g.awayId];
    if (!h || !a) return;
    h.log.push({ home: true, pf: g.homeScore, pa: g.awayScore, win: g.homeScore > g.awayScore });
    a.log.push({ home: false, pf: g.awayScore, pa: g.homeScore, win: g.awayScore > g.homeScore });
  });

  function split(log) {
    var w = log.filter(function (x) { return x.win; }).length;
    return {
      n: log.length, w: w, l: log.length - w,
      pf: avg(log.map(function (x) { return x.pf; })),
      pa: avg(log.map(function (x) { return x.pa; }))
    };
  }

  var allPts = [];
  Object.keys(teams).forEach(function (id) {
    var t = teams[id];
    t.all = split(t.log);
    t.l5 = split(t.log.slice(-5));
    t.l10 = split(t.log.slice(-10));
    t.homeRec = split(t.log.filter(function (x) { return x.home; }));
    t.awayRec = split(t.log.filter(function (x) { return !x.home; }));
    t.log.forEach(function (x) { allPts.push(x.pf); });
  });
  var leagueAvg = avg(allPts) || 114;

  // ---- Projection ----
  // Attaque et défense : moyenne sur la période choisie (5 derniers par défaut),
  // ramenée vers la moyenne de la ligue parce que l'échantillon est petit.
  var BASES = { all: "Saison (recommandé)", mix: "Saison + 10 derniers", l10: "10 derniers matchs", l5: "5 derniers matchs" };
  var BASIS_KEY = "paris-stats-base-v2";
  var basis = "all";
  try { basis = localStorage.getItem(BASIS_KEY) || "all"; } catch (e) {}
  if (!BASES[basis]) basis = "all";

  function shrunk(s, key) {
    return (s[key] * s.n + leagueAvg * SHRINK_GAMES) / (s.n + SHRINK_GAMES);
  }
  function rating(t, key) {
    if (basis === "mix") return 0.6 * shrunk(t.all, key) + 0.4 * shrunk(t.l10, key);
    return shrunk(t[basis], key);
  }

  var bankroll = 0;
  try { bankroll = parseFloat(localStorage.getItem("paris-stats-bankroll")) || 0; } catch (e) {}

  // Fonction de répartition de la loi normale centrée réduite.
  function normCdf(z) {
    var t = 1 / (1 + 0.2316419 * Math.abs(z));
    var d = 0.3989423 * Math.exp(-z * z / 2);
    var p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
    return z > 0 ? 1 - p : p;
  }

  function project(h, a) {
    var homePts = rating(h, "pf") * rating(a, "pa") / leagueAvg + HOME_EDGE / 2;
    var awayPts = rating(a, "pf") * rating(h, "pa") / leagueAvg - HOME_EDGE / 2;
    var pHome = normCdf((homePts - awayPts) / MARGIN_SD);
    return { homePts: homePts, awayPts: awayPts, pHome: pHome, pAway: 1 - pHome };
  }

  function americanToDecimal(a) {
    if (typeof a !== "number" || !isFinite(a) || a === 0) return null;
    return a > 0 ? 1 + a / 100 : 1 + 100 / Math.abs(a);

    if (cls === "yes" && bankroll > 0) {

      var f = Math.min((b * p - (1 - p)) / b * KELLY_FRAC, MAX_STAKE);

      } else if (b.market === "spread" && typeof u.odds.spread === "number" && u.odds.spread !== b.closeLine) { b.closeLine = u.odds.spread; changed = true; }

  // abbr() est défini plus haut.
  function sideLine(x) { return (x > 0 ? "+" : "") + x; }

  // b.line : écart du point de vue du domicile, ou total.
  function betLabel(b) {
    if (b.market === "ml") return abbr(b.pick === "home" ? b.homeId : b.awayId) + " gagne";
    if (b.market === "spread") return b.pick === "home" ? abbr(b.homeId) + " " + sideLine(b.line) : abbr(b.awayId) + " " + sideLine(-b.line);
    if (b.market === "prop") return (b.playerName || "?") + " " + (b.pick === "over" ? "Over " : "Under ") + b.line + " " + (STATS[b.stat] ? STATS[b.stat].short : "");
    return (b.pick === "over" ? "Over " : "Under ") + b.line;
  }

  function propValue(b) {
    if (!PL || !STATS[b.stat] || (PL.done || []).indexOf(b.gameId) < 0) return undefined;
    var pl = PL.players[b.playerId], row = pl && pl.g.filter(function (r) { return r[0] === b.gameId; })[0];
    return row ? row[STATS[b.stat].i] : null; // null = n'a pas joué
  }
  function betResult(b) {
    var g = gameById[b.gameId];
    if (!g) return null;
    if (b.market === "prop") {
      var pv = propValue(b);
      if (pv === undefined) return null;
      if (pv === null) return "P";
      var px = pv - b.line; if (b.pick === "under") px = -px;
      return px > 0 ? "W" : px < 0 ? "L" : "P";
    }
    var m = g.homeScore - g.awayScore, x;
    if (b.market === "ml") x = (b.pick === "home") === (m > 0) ? 1 : -1;
    else if (b.market === "spread") { x = m + b.line; if (b.pick === "away") x = -x; }
    else { x = g.homeScore + g.awayScore - b.line; if (b.pick === "under") x = -x; }
    return x > 0 ? "W" : x < 0 ? "L" : "P";
  }
  function betProfit(b, r) { return r === "W" ? b.stake * (b.odds - 1) : r === "L" ? -b.stake : r === "P" ? 0 : null; }

  function betClv(b) {

      return { v: cv, txt: (cv > 0 ? "+" : "") + (cv * 100).toFixed(1) + " %" };

    var d = b.market === "spread" ? (b.pick === "home" ? b.line - b.closeLine : b.closeLine - b.line)

  // Valeurs de la stat du joueur dans ses derniers matchs contre cet adversaire (saison en cours + saisons passées).
  function vsOpp(pid, p, oppId) {
    var st = STATS[plStat], out = [];
    p.g.forEach(function (r) { if (r[3] === oppId) out.push({ d: r[1], v: r[st.i] }); });
    Object.keys(HBOX).forEach(function (gid) {
      var g = HBOX[gid];

      for (var i = 0; i < g.r.length; i++) {

      }

    return out.sort(function (x, y) { return y.d.localeCompare(x.d); }).slice(0, plVsN).map(function (x) { return x.v; });
  }

  function plRows(g, teamId, oppId) {
    var st = STATS[plStat];
    var oppF = st.opp && teams[oppId] ? shrunk(teams[oppId].all, "pa") / leagueAvg : 1;
    var rows = [];
    Object.keys(PL.players).forEach(function (pid) {
      var p = PL.players[pid];
      if (p.t !== teamId || p.g.length < 3) return;
      var mins = p.g.map(function (r) { return r[5]; });
      if (avg(mins) < 12) return;
      var vals = p.g.map(function (r) { return r[st.i]; });
      var season = avg(vals), last5 = avg(vals.slice(-5)), min5 = avg(mins.slice(-5));
      var sd = Math.sqrt(avg(vals.map(function (v) { return (v - season) * (v - season); })) * vals.length / Math.max(1, vals.length - 1));
      var proj = (0.6 * season + 0.4 * last5) * oppF;
      rows.push({ pid: pid, p: p, season: season, last5: last5, min5: min5, sd: Math.max(sd, st.floor), proj: proj, last10: vals.slice(-10), inj: injuryOf(teamId, pid), gid: g.id, oppF: oppF, vs: vsOpp(pid, p, oppId) });
    });

  }

  function plResultHtml(info) {

    var pOver = 1 - normCdf((line - info.proj) / info.sd);
    var hits = info.last10.filter(function (v) { return v > line; }).length;
    var oO = parseFloat(L.o) > 1 ? parseFloat(L.o) : STD_DEC, oU = parseFloat(L.u) > 1 ? parseFloat(L.u) : STD_DEC;
    var evO = pOver * oO - 1, evU = (1 - pOver) * oU - 1;
    var over = evO >= evU, best = over ? "over" : "under";
    var vsHits = info.vs.filter(function (v) { return v > line; }).length;
    return {
      hit: hits + "/" + info.last10.length,
      vsHit: info.vs.length ? vsHits + "/" + info.vs.length : "",
      pct: pct(pOver),
      val: (over ? "Over " : "Under ") + verdict(over ? pOver : 1 - pOver, over ? oO : oU) +

        ["home", "away"].forEach(function (k) {
          var inp = app.querySelector('input.odds[data-id="' + g.id + ":" + k + '"]');
          odds[k] = inp && parseFloat(inp.value) > 1 ? parseFloat(inp.value) : NaN;
        });
      } else if (m === "spread") {
        opts = [["away", a + " " + (typeof o.spread === "number" ? sgn(-o.spread) : "")], ["home", h + " " + (typeof o.spread === "number" ? sgn(o.spread) : "")]];
        odds = { home: STD_DEC, away: STD_DEC };
        line = typeof o.spread === "number" ? (pick === "home" ? o.spread : -o.spread) : "";
      } else {
        opts = [["over", "Over"], ["under", "Under"]];
        odds = { over: STD_DEC, under: STD_DEC };
        line = typeof o.total === "number" ? o.total : "";
      }
      $("bmTitle").textContent = a + " @ " + h + " · " + { ml: "Gagnant du match", spread: "Écart", total: "Total de points" }[m];
    }
    draft.odds = odds;
    $("bmSeg").innerHTML = opts.map(function (x) { return '<button type="button" data-pick="' + x[0] + '">' + esc(x[1]) + "</button>"; }).join("");
    $("bmLineWrap").hidden = m === "ml";
    $("bmLine").value = line;
    draft.pick = null;
    setPick(pick);
    $("bmWho").value = whoLast;
    renderWho();
    modal.hidden = false;
    $("bmStake").focus();
  }

  function setPick(v) {
    var prev = draft.pick;
    draft.pick = v;
    $("bmPick").value = v;
    $("bmSeg").querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-pick") === v); });
    draft.p = draft.p0 == null ? null : (v === draft.pick0 ? draft.p0 : 1 - draft.p0);
    var d = draft.odds[v];
    $("bmOdds").value = isFinite(d) ? d.toFixed(2) : "";
    if (prev && prev !== v && draft.market === "spread" && $("bmLine").value !== "") $("bmLine").value = -parseFloat($("bmLine").value);
    var sug = suggestedStake(draft.p, parseFloat($("bmOdds").value));
    if (sug) $("bmStake").value = sug;
    else if (!prev) $("bmStake").value = "";
    renderStakeChips();
    updateSum();
  }

  function renderStakeChips() {
    var sug = suggestedStake(draft.p, parseFloat($("bmOdds").value)), cur = parseFloat($("bmStake").value);
    var list = (sug ? [[sug, "Suggérée " + sug + " $"]] : []).concat([10, 20, 50, 100].map(function (v) { return [v, v + " $"]; }));
    $("bmStakeChips").innerHTML = list.map(function (x) {
      return '<button type="button" data-stake="' + x[0] + '"' + (x[0] === cur ? ' class="on"' : "") + ">" + x[1] + "</button>";
    }).join("");
  }
  function renderWho() {
    var cur = $("bmWho").value.trim();
    $("bmWhoChips").innerHTML = knownWho().map(function (n) {
      return '<button type="button" data-who-pick="' + esc(n) + '"' + (n === cur ? ' class="on"' : "") + ">" + esc(n) + "</button>";
    }).join("");
  }
  function updateSum() {
    var dec = parseFloat($("bmOdds").value), stake = parseFloat($("bmStake").value), p = draft.p;
    var sum = "";
    if (p) sum += "Notre chance : <b>" + pct(p) + "</b>" + (dec > 1 ? " · notre cote " + (1 / p).toFixed(2) + " · " + verdict(p, dec) : "");
    else sum += "Pas de probabilité du modèle pour ce pari.";
    if (draft.market !== "ml" && draft.market !== "prop") sum += '<br><span class="sub">Cote -110 (1.91) par défaut : remplace-la par celle du book.</span>';
    $("bmSum").innerHTML = sum;
    $("bmGain").innerHTML = dec > 1 && stake > 0
      ? "Si ça passe : <b>+" + (stake * (dec - 1)).toFixed(2) + " $</b> <span class=\"sub\">(retour " + (stake * dec).toFixed(2) + " $)</span>"
      : '<span class="sub">Entre la cote et la mise pour voir le gain.</span>';
    $("bmStakeChips").querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", parseFloat(b.getAttribute("data-stake")) === stake); });
  }

  var toastTimer = null;
  function toast(html) {
    var t = $("toast");
    t.innerHTML = html;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 5000);
  }

  $("bmSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-pick]");
    if (b) setPick(b.getAttribute("data-pick"));
  });
  $("bmStakeChips").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-stake]");
    if (b) { $("bmStake").value = b.getAttribute("data-stake"); updateSum(); }
  });
  $("bmWhoChips").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-who-pick]");
    if (b) { $("bmWho").value = b.getAttribute("data-who-pick"); renderWho(); }
  });
  $("bmWho").addEventListener("input", renderWho);
  $("bmOdds").addEventListener("input", function () {
    var d = parseFloat($("bmOdds").value);
    if (d > 1) draft.odds[draft.pick] = d;
    renderStakeChips(); updateSum();
  });
  $("bmStake").addEventListener("input", updateSum);
  function closeModal() { modal.hidden = true; }
  $("bmCancel").addEventListener("click", closeModal);
  $("bmX").addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !modal.hidden) closeModal(); });
  $("toast").addEventListener("click", function (e) {
    if (e.target.closest("button[data-goto]")) { showView("paris"); $("toast").hidden = true; window.scrollTo(0, 0); }
  });

  $("betForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var pick = $("bmPick").value;
    var odds = parseFloat($("bmOdds").value), stake = parseFloat($("bmStake").value);
    var who = $("bmWho").value.trim();
    if (!(odds > 1)) { $("bmOdds").focus(); return; }
    if (!(stake > 0)) { $("bmStake").focus(); return; }
    if (!who) { $("bmWho").focus(); return; }
    var b = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), gameId: draft.gameId, date: draft.date, homeId: draft.homeId, awayId: draft.awayId,
      market: draft.market, pick: pick, odds: odds, stake: stake, who: who, p: draft.p, createdAt: new Date().toISOString() };
    if (draft.market === "prop") { b.playerId = draft.playerId; b.playerName = draft.playerName; b.stat = draft.stat; }
    if (b.market !== "ml") {
      var lv = parseFloat($("bmLine").value);
      if (!isFinite(lv)) { $("bmLine").focus(); return; }
      b.line = b.market === "spread" ? (pick === "home" ? lv : -lv) : lv;
    }
    bets.push(b); saveBets();
    whoLast = who; try { localStorage.setItem("paris-stats-who", who); } catch (err) {}
    closeModal();
    renderBets();
    toast("✓ Pari ajouté : <b>" + esc(betLabel(b)) + "</b> · " + stake.toFixed(0) + ' $ <button type="button" class="btn" data-goto="paris">Voir nos paris</button>');
  });

  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.id === "marge") {
      var mv = parseFloat(el.value);
      if (!isFinite(mv) || mv < 0 || mv > 50) return;
      EV_GOOD = mv / 100; EV_SUSPECT = Math.max(0.15, EV_GOOD + 0.10);
      try { localStorage.setItem("paris-stats-marge", String(mv)); } catch (err) {}
      document.getElementById("upcoming").innerHTML = basisHtml() + upcomingHtml();
      renderPlayers();
      return;
    }
    if (el.id === "bankroll") {
      bankroll = parseFloat(el.value) || 0;
      try { localStorage.setItem("paris-stats-bankroll", String(bankroll)); } catch (err) {}
      document.getElementById("upcoming").innerHTML = basisHtml() + upcomingHtml();
      return;
    }
    if (!el.classList || !el.classList.contains("odds")) return;
    var id = el.getAttribute("data-id");
    if (el.value === "") delete saved[id]; else saved[id] = { v: el.value, t: Date.now() };
    save();
    refresh(el);
  });

  function refresh(el) {
    var id = el.getAttribute("data-id");
    var book = parseFloat(el.getAttribute("data-book"));
    var dec = saved[id] ? parseFloat(saved[id].v) : (el.value === "" ? NaN : book);
    app.querySelector('.ev[data-for="' + id + '"]').innerHTML = verdict(parseFloat(el.getAttribute("data-p")), dec);
    var bb = app.querySelector('button.addbet[data-odds-from="' + id + '"]');
    if (bb) bb.classList.toggle("hot", isHot(parseFloat(el.getAttribute("data-p")), dec));
    app.querySelector('.src[data-src="' + id + '"]').innerHTML = sourceHtml(id, el.value, isFinite(book), el.getAttribute("data-prov"));
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target : null;
    if (!t) return;
    var nv = t.closest("nav.menu button[data-view]");
    if (nv) { showView(nv.getAttribute("data-view")); return; }
    var ab = t.closest("button.addbet");
    if (ab) { openBet(ab); return; }
    var wb = t.closest("button[data-who]");
    if (wb) { whoFilter = wb.getAttribute("data-who"); renderBets(); return; }
    var del = t.closest("button[data-del]");
    if (del) {
      var did = del.getAttribute("data-del");
      if (del.getAttribute("data-confirm") !== "1") { del.setAttribute("data-confirm", "1"); del.textContent = "Supprimer ?"; return; }
      bets = bets.filter(function (b) { return b.id !== did; }); saveBets(); renderBets(); return;
    }
    if (t.closest("#betExport")) {
      var txt = JSON.stringify(bets);
      var msg = document.getElementById("betMsg");
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { msg.textContent = bets.length + " paris copiés."; }, function () { msg.textContent = "Copie refusée par le navigateur."; });
      return;
    }
    if (t.closest("#betImportOpen")) { document.getElementById("betImportBox").hidden = false; return; }
    if (t.closest("#betImport")) {
      var m2 = document.getElementById("betMsg"), arr;
      try { arr = JSON.parse(document.getElementById("betImportTxt").value); } catch (err) { m2.textContent = "Texte invalide."; return; }
      if (!Array.isArray(arr)) { m2.textContent = "Texte invalide."; return; }
      var have = {}; bets.forEach(function (b) { have[b.id] = true; });
      var added = 0;
      arr.forEach(function (b) {
        if (b && typeof b.id === "string" && !have[b.id] && b.gameId && ["ml", "spread", "total", "prop"].indexOf(b.market) >= 0 && Number.isFinite(b.odds) && b.odds > 1 && Number.isFinite(b.stake) && b.stake > 0 && typeof b.who === "string" && Number.isFinite(Date.parse(b.date)) && (b.market === "total" || b.market === "prop" ? ["over", "under"] : ["home", "away"]).indexOf(b.pick) >= 0 && (b.market === "ml" || Number.isFinite(b.line)) && (b.market !== "prop" || (typeof b.playerId === "string" && !!STATS[b.stat]))) { bets.push(b); have[b.id] = true; added++; }
      });
      saveBets(); renderBets();
      document.getElementById("betMsg").textContent = added + " pari(s) ajouté(s).";
      return;
    }
    var reset = e.target.closest ? e.target.closest("button[data-reset]") : null;
    if (reset) {
      var rid = reset.getAttribute("data-reset");
      var input = app.querySelector('input.odds[data-id="' + rid + '"]');
      var book = parseFloat(input.getAttribute("data-book"));
      delete saved[rid];
      save();
      input.value = isFinite(book) ? book.toFixed(2) : "";
      refresh(input);
      return;
    }
    var pick = e.target.closest ? e.target.closest("button[data-basis]") : null;
    if (pick) {
      basis = pick.getAttribute("data-basis");
      try { localStorage.setItem(BASIS_KEY, basis); } catch (err) {}
      document.getElementById("upcoming").innerHTML = basisHtml() + upcomingHtml();
      return;
    }
    var th = e.target.closest ? e.target.closest("th[data-col]") : null;
    if (!th) return;
    var i = +th.getAttribute("data-col");
    if (i === sortCol) sortDir = -sortDir; else { sortCol = i; sortDir = cols[i].text ? 1 : -1; }
    document.getElementById("table").innerHTML = tableHtml();
  });
})();
</script>
</body>
</html>
