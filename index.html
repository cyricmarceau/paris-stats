<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paris stats NBA</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0 auto; max-width: 1100px; padding: 16px;
    background: var(--background, #0f1218); /* page-bg */
    color: var(--foreground, #e7eaf0);
    font-family: var(--font-sans, system-ui, "Segoe UI", sans-serif);
    font-size: 14px; line-height: 1.45;
  }
  h1 { font-size: 22px; margin: 0 0 2px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .sub { color: var(--muted-foreground, #97a0b3); font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; white-space: nowrap; }
  th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--border, #262c3a); }
  th { font-weight: 600; font-size: 12px; color: var(--muted-foreground, #97a0b3); cursor: pointer; user-select: none; }
  th.sorted { color: var(--foreground, #e7eaf0); }
  th:first-child, td:first-child { text-align: left; }
  td.team { display: flex; align-items: center; gap: 8px; }
  td.team img { width: 20px; height: 20px; }
  .pos { color: var(--success, #4ade80); }
  .neg { color: var(--destructive, #f87171); }

  .games { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .game {
    background: var(--card, #171b25); border: 1px solid var(--border, #262c3a);
    border-radius: var(--radius, 10px); padding: 14px 16px;
  }
  .game .when { color: var(--muted-foreground, #97a0b3); font-size: 12px; margin-bottom: 8px; }
  .side { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; }
  .side + .side { border-top: 1px solid var(--border, #262c3a); }
  .side .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .side .name img { width: 22px; height: 22px; }
  .side .name small { font-weight: 400; color: var(--muted-foreground, #97a0b3); }
  .side .proj { font-size: 20px; font-weight: 700; }
  .side .line { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--muted-foreground, #97a0b3); }
  .side .line b { color: var(--foreground, #e7eaf0); font-weight: 600; }
  input.odds {
    width: 68px; padding: 4px 6px; font: inherit; text-align: right;
    color: var(--foreground, #e7eaf0); background: var(--background, #0f1218);
    border: 1px solid var(--border, #262c3a); border-radius: 6px;
  }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.yes { background: var(--success, #4ade80); color: #06240f; }
  .badge.thin { background: var(--warning, #facc15); color: #2a2000; }
  .badge.no { border: 1px solid var(--border, #262c3a); }
  .badge.sus { background: #fb923c; color: #2a1000; }
  .stake { font-weight: 600; color: var(--foreground, #e7eaf0); }
  .mkt { display: block; margin-top: 4px; }
  .bank { margin: 6px 0 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bank input { width: 90px; }
  .basis { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .basis button {
    font: inherit; padding: 4px 12px; cursor: pointer; border-radius: 999px;
    color: var(--foreground, #e7eaf0); background: none; border: 1px solid var(--border, #262c3a);
  }
  .basis button.on { background: var(--foreground, #e7eaf0); color: var(--background, #0f1218); }
  .src { font-size: 12px; }
  button.reset {
    font: inherit; font-size: 12px; padding: 1px 7px; cursor: pointer;
    color: var(--foreground, #e7eaf0); background: none;
    border: 1px solid var(--border, #262c3a); border-radius: 6px;
  }
  .stale {
    margin-top: 14px; padding: 10px 14px; border-radius: var(--radius, 10px);
    border: 1px solid var(--warning, #facc15); color: var(--warning, #facc15);
  }
  .foot { margin-top: 8px; font-size: 12px; color: var(--muted-foreground, #97a0b3); }
  details { margin-top: 24px; color: var(--muted-foreground, #97a0b3); font-size: 13px; }
  details p { max-width: 70ch; }
  .empty { padding: 24px; border: 1px dashed var(--border, #262c3a); border-radius: var(--radius, 10px); }
  nav.menu { display: flex; gap: 6px; margin: 14px 0 4px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; padding: 8px 0; background: var(--background, #0f1218); }
  nav.menu button { font: inherit; font-weight: 600; padding: 7px 14px; cursor: pointer; border-radius: 999px; color: var(--foreground, #e7eaf0); background: none; border: 1px solid var(--border, #262c3a); }
  nav.menu button.on { background: var(--foreground, #e7eaf0); color: var(--background, #0f1218); }
  nav.menu .count { font-size: 11px; opacity: .7; margin-left: 4px; }
  .view[hidden] { display: none; }
  button.addbet { font: inherit; font-size: 12px; padding: 2px 9px; cursor: pointer; border-radius: 6px; color: var(--foreground, #e7eaf0); background: none; border: 1px dashed var(--border, #3a4255); }
  button.addbet:hover { border-style: solid; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .modal[hidden] { display: none; }
  .tools[hidden] { display: none; }
  .info { display: block; margin-top: 4px; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border, #262c3a); margin-left: 4px; }
  .tag.out { border-color: var(--destructive, #f87171); color: var(--destructive, #f87171); }
  .tag.dtd { border-color: var(--warning, #facc15); color: var(--warning, #facc15); }
  .plsel { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  .plsel select { font: inherit; padding: 6px 8px; color: var(--foreground, #e7eaf0); background: var(--background, #0f1218); border: 1px solid var(--border, #262c3a); border-radius: 6px; max-width: 100%; }
  table.pl td, table.pl th { padding: 6px 8px; }
  table.pl input { width: 58px; padding: 3px 5px; font: inherit; text-align: right; color: var(--foreground, #e7eaf0); background: var(--background, #0f1218); border: 1px solid var(--border, #262c3a); border-radius: 6px; }
  table.pl tr.out td { opacity: .45; }
  .pname small { color: var(--muted-foreground, #97a0b3); }
  .modal form { background: var(--card, #171b25); border: 1px solid var(--border, #262c3a); border-radius: var(--radius, 10px); padding: 18px; width: 100%; max-width: 380px; display: grid; gap: 10px; }
  .modal h3 { margin: 0; font-size: 16px; }
  .modal label { display: grid; gap: 4px; font-size: 12px; color: var(--muted-foreground, #97a0b3); }
  .modal input, .modal select { font: inherit; padding: 7px 9px; color: var(--foreground, #e7eaf0); background: var(--background, #0f1218); border: 1px solid var(--border, #262c3a); border-radius: 6px; }
  .modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn { font: inherit; font-weight: 600; padding: 7px 14px; cursor: pointer; border-radius: 8px; color: var(--foreground, #e7eaf0); background: none; border: 1px solid var(--border, #262c3a); }
  .btn.main { background: var(--success, #4ade80); color: #06240f; border-color: transparent; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
  .kpi { background: var(--card, #171b25); border: 1px solid var(--border, #262c3a); border-radius: var(--radius, 10px); padding: 10px 12px; }
  .kpi .l { font-size: 11px; color: var(--muted-foreground, #97a0b3); text-transform: uppercase; letter-spacing: .05em; }
  .kpi .v { font-size: 20px; font-weight: 700; }
  .res-W { color: var(--success, #4ade80); font-weight: 700; }
  .res-L { color: var(--destructive, #f87171); font-weight: 700; }
  .res-P, .res-pending { color: var(--muted-foreground, #97a0b3); }
  button.del { font: inherit; background: none; border: 0; color: var(--muted-foreground, #97a0b3); cursor: pointer; font-size: 15px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .tools textarea { width: 100%; min-height: 90px; font: 12px var(--font-mono, ui-monospace, monospace); color: var(--foreground, #e7eaf0); background: var(--background, #0f1218); border: 1px solid var(--border, #262c3a); border-radius: 6px; padding: 8px; }
  code { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
</style>
</head>
<body>
<h1>Paris stats NBA</h1>
<div class="sub" id="meta"></div>

<div id="app"></div>

<script src="data.js"></script>
<script src="players.js"></script>
<script src="h2h.js"></script>
<script>
(function () {
  "use strict";

  // ---- Réglages du modèle ----
  var HOME_EDGE = 2.5;     // avantage du terrain, en points d'écart
  var MARGIN_SD = 12;      // écart-type de l'écart final d'un match NBA
  var SHRINK_GAMES = 6;    // poids de la moyenne de la ligue, en matchs (6 = le plus proche des lignes du marché au test)
  var TOTAL_SD = 18;       // écart-type du total de points d'un match NBA
  // Marge de sécurité : valeur espérée minimale pour dire « ça vaut le coup » (réglable dans la page, 10 % par défaut).
  var EV_GOOD = 0.10;
  try { var mg = parseFloat(localStorage.getItem("paris-stats-marge")); if (isFinite(mg) && mg >= 0 && mg <= 50) EV_GOOD = mg / 100; } catch (e) {}
  // Au-delà, l'écart avec le book vient presque toujours d'une info que le modèle n'a pas.
  var EV_SUSPECT = Math.max(0.15, EV_GOOD + 0.10);
  var STD_DEC = 1.91;      // cote supposée (-110) pour l'écart et le total, ESPN ne les fournit pas
  var KELLY_FRAC = 0.25;   // quart de Kelly
  var MAX_STAKE = 0.03;
  // Stats des joueurs : colonne dans players.js, plancher de l'écart-type, ajustement par la défense adverse.
  var STATS = {
    pts: { i: 6, label: "Points", short: "pts", floor: 4, opp: true },
    reb: { i: 7, label: "Rebonds", short: "reb", floor: 2 },
    ast: { i: 8, label: "Passes", short: "passes", floor: 1.5 },
    tpm: { i: 9, label: "Paniers à 3 pts", short: "3 pts", floor: 1 }
  };    // jamais plus de 3 % de la bankroll sur un pari

  var data = window.NBA_DATA;
  var app = document.getElementById("app");
  var meta = document.getElementById("meta");

  if (!data || !data.teams || !data.games) {
    app.innerHTML = '<div class="empty">Aucune donnée. Lance <code>node fetch-data.mjs</code> dans ce dossier, puis recharge la page.</div>';
    return;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function f1(x) { return x.toFixed(1); }
  function pct(x) { return (x * 100).toFixed(0) + " %"; }
  function avg(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : 0; }

  // ---- Statistiques par équipe ----
  var teams = {};
  data.teams.forEach(function (t) { teams[t.id] = { info: t, log: [] }; });

  data.games.slice().sort(function (a, b) { return new Date(a.date) - new Date(b.date); }).forEach(function (g) {
    var h = teams[g.homeId], a = teams[g.awayId];
    if (!h || !a) return;
    h.log.push({ home: true, pf: g.homeScore, pa: g.awayScore, win: g.homeScore > g.awayScore });
    a.log.push({ home: false, pf: g.awayScore, pa: g.homeScore, win: g.awayScore > g.homeScore });
  });

  function split(log) {
    var w = log.filter(function (x) { return x.win; }).length;
    return {
      n: log.length, w: w, l: log.length - w,
      pf: avg(log.map(function (x) { return x.pf; })),
      pa: avg(log.map(function (x) { return x.pa; }))
    };
  }

  var allPts = [];
  Object.keys(teams).forEach(function (id) {
    var t = teams[id];
    t.all = split(t.log);
    t.l5 = split(t.log.slice(-5));
    t.l10 = split(t.log.slice(-10));
    t.homeRec = split(t.log.filter(function (x) { return x.home; }));
    t.awayRec = split(t.log.filter(function (x) { return !x.home; }));
    t.log.forEach(function (x) { allPts.push(x.pf); });
  });
  var leagueAvg = avg(allPts) || 114;

  // ---- Projection ----
  // Attaque et défense : moyenne sur la période choisie (5 derniers par défaut),
  // ramenée vers la moyenne de la ligue parce que l'échantillon est petit.
  var BASES = { all: "Saison (recommandé)", mix: "Saison + 10 derniers", l10: "10 derniers matchs", l5: "5 derniers matchs" };
  var BASIS_KEY = "paris-stats-base-v2";
  var basis = "all";
  try { basis = localStorage.getItem(BASIS_KEY) || "all"; } catch (e) {}
  if (!BASES[basis]) basis = "all";

  function shrunk(s, key) {
    return (s[key] * s.n + leagueAvg * SHRINK_GAMES) / (s.n + SHRINK_GAMES);
  }
  function rating(t, key) {
    if (basis === "mix") return 0.6 * shrunk(t.all, key) + 0.4 * shrunk(t.l10, key);
    return shrunk(t[basis], key);
  }

  var bankroll = 0;
  try { bankroll = parseFloat(localStorage.getItem("paris-stats-bankroll")) || 0; } catch (e) {}

  // Fonction de répartition de la loi normale centrée réduite.
  function normCdf(z) {
    var t = 1 / (1 + 0.2316419 * Math.abs(z));
    var d = 0.3989423 * Math.exp(-z * z / 2);
    var p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
    return z > 0 ? 1 - p : p;
  }

  function project(h, a) {
    var homePts = rating(h, "pf") * rating(a, "pa") / leagueAvg + HOME_EDGE / 2;
    var awayPts = rating(a, "pf") * rating(h, "pa") / leagueAvg - HOME_EDGE / 2;
    var pHome = normCdf((homePts - awayPts) / MARGIN_SD);
    return { homePts: homePts, awayPts: awayPts, pHome: pHome, pAway: 1 - pHome };
  }

  function americanToDecimal(a) {
    if (typeof a !== "number" || !isFinite(a) || a === 0) return null;
    return a > 0 ? 1 + a / 100 : 1 + 100 / Math.abs(a);
  }

  // ---- Cotes saisies à la main (gardées dans le navigateur) ----
  var STORE = "paris-stats-cotes";
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; } catch (e) { saved = {}; }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {} }

  // Oublie les cotes saisies pour des matchs qui ne sont plus dans les données.
  (function () {
    var ids = {};
    (data.upcoming || []).forEach(function (g) { ids[g.id] = true; });
    Object.keys(saved).forEach(function (k) {
      var s = saved[k];
      if (!ids[k.split(":")[0]] || !s || typeof s !== "object") delete saved[k];
    });
    save();
  })();

  var dayFmt = new Intl.DateTimeFormat("fr-CA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

  // D'où vient la cote affichée : saisie à la main (avec sa date) ou importée.
  function sourceHtml(id, typed, hasBook, provider) {
    var back = hasBook ? "Remettre " + esc(provider) : "Effacer";
    var btn = ' <button class="reset" type="button" data-reset="' + esc(id) + '">' + back + "</button>";
    if (saved[id]) return "saisie le " + esc(dayFmt.format(new Date(saved[id].t))) + btn;
    if (typed === "") return hasBook ? btn : "";
    return hasBook ? esc(provider) : "";
  }

  function verdict(p, dec) {
    if (!isFinite(dec) || dec <= 1) return "";
    var ev = p * dec - 1;
    var cls, txt;
    if (ev >= EV_SUSPECT) { cls = "sus"; txt = "Suspect : vérifie blessures et repos"; }
    else if (ev >= EV_GOOD) { cls = "yes"; txt = "Ça vaut le coup"; }
    else if (ev > 0) { cls = "thin"; txt = "Mince"; }
    else { cls = "no"; txt = "Non"; }
    var stake = "";
    if (cls === "yes" && bankroll > 0) {
      var b = dec - 1;
      var f = Math.min((b * p - (1 - p)) / b * KELLY_FRAC, MAX_STAKE);
      if (f > 0) stake = ' <span class="stake num">Mise ' + Math.round(f * bankroll) + " $</span>";
    }
    return '<span class="num ' + (ev > 0 ? "pos" : "neg") + '">' + (ev > 0 ? "+" : "") + (ev * 100).toFixed(1) +
      ' %</span> <span class="badge ' + cls + '">' + txt + "</span>" + stake;
  }

  function sgn(x) { return (x > 0 ? "+" : "") + x; }

  // Écart et total : probabilité du meilleur côté contre une cote standard de -110.
  function marketsHtml(g, h, a, pr, o) {
    var out = [];
    var margin = pr.homePts - pr.awayPts, total = pr.homePts + pr.awayPts;
    if (typeof o.spread === "number") {
      var pHome = normCdf((margin + o.spread) / MARGIN_SD);
      var side = pHome >= 0.5 ? esc(h.info.abbr) + " " + sgn(o.spread) : esc(a.info.abbr) + " " + sgn(-o.spread);
      var p = Math.max(pHome, 1 - pHome);
      out.push('<span class="mkt">Écart : <b>' + side + "</b> couvre à " + pct(p) + " · " + verdict(p, STD_DEC) +
        ' <button type="button" class="addbet" data-g="' + esc(g.id) + '" data-m="spread" data-pick="' + (pHome >= 0.5 ? "home" : "away") + '" data-p="' + p + '">＋ Parier</button></span>');
    }
    if (typeof o.total === "number") {
      var pOver = 1 - normCdf((o.total - total) / TOTAL_SD);
      var tside = pOver >= 0.5 ? "Over " + o.total : "Under " + o.total;
      var tp = Math.max(pOver, 1 - pOver);
      out.push('<span class="mkt">Total : <b>' + tside + "</b> à " + pct(tp) + " · " + verdict(tp, STD_DEC) +
        ' <button type="button" class="addbet" data-g="' + esc(g.id) + '" data-m="total" data-pick="' + (pOver >= 0.5 ? "over" : "under") + '" data-p="' + tp + '">＋ Parier</button></span>');
    }
    return out.length ? out.join("") + '<span class="mkt">(écart et total calculés à une cote de -110)</span>' : "";
  }

  function sideHtml(g, key, t, pts, p, bookDec, isHome) {
    var id = g.id + ":" + key;
    var provider = (g.odds && g.odds.provider) || "le book";
    var val = saved[id] ? saved[id].v : (bookDec ? bookDec.toFixed(2) : "");
    // Le calcul garde la cote importée exacte ; seul l'affichage est arrondi.
    var dec = saved[id] ? parseFloat(saved[id].v) : bookDec;
    var logo = t.info.logo ? '<img src="' + esc(t.info.logo) + '" alt="">' : "";
    return '<div class="side">' +
      '<div class="name">' + logo + esc(t.info.name) + " <small>" + (isHome ? "dom." : "étr.") + " · " + t.all.w + "-" + t.all.l + "</small></div>" +
      '<div class="proj num">' + f1(pts) + "</div>" +
      '<div class="line">' +
        "<span>Victoire <b class=\"num\">" + pct(p) + "</b></span>" +
        "<span>Notre cote <b class=\"num\">" + (1 / p).toFixed(2) + "</b></span>" +
        '<label>Cote du book <input class="odds num" type="number" inputmode="decimal" step="0.01" min="1.01" placeholder="1.90" ' +
          'data-id="' + esc(id) + '" data-p="' + p + '" data-book="' + (bookDec || "") + '" data-prov="' + esc(provider) +
          '" value="' + esc(val) + '"></label>' +
        '<span class="src" data-src="' + esc(id) + '">' + sourceHtml(id, val, !!bookDec, provider) + "</span>" +
        '<span class="ev" data-for="' + esc(id) + '">' + verdict(p, dec) + "</span>" +
        '<button type="button" class="addbet" data-g="' + esc(g.id) + '" data-m="ml" data-pick="' + key + '" data-p="' + p + '" data-odds-from="' + esc(id) + '">＋ Parier</button>' +
      "</div></div>";
  }

  function abbr(id) { return teams[id] ? teams[id].info.abbr : "?"; }

  // ---- Face-à-face et blessures ----
  var PL = window.NBA_PLAYERS && window.NBA_PLAYERS.players ? window.NBA_PLAYERS : null;
  var H2H = window.NBA_H2H && Array.isArray(window.NBA_H2H.games) ? window.NBA_H2H.games : [];
  var STATUS_FR = { "Out": ["absent", "out"], "Day-To-Day": ["incertain", "dtd"], "Questionable": ["incertain", "dtd"], "Doubtful": ["douteux", "out"], "Probable": ["probable", ""], "Suspension": ["suspendu", "out"] };
  function injuryOf(teamId, playerId) {
    var list = PL && PL.injuries && PL.injuries[teamId] || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === playerId) return list[i];
    return null;
  }
  function statusTag(inj) {
    if (!inj) return "";
    var fr = STATUS_FR[inj.s] || [inj.s, "dtd"];
    return '<span class="tag ' + fr[1] + '" title="' + esc(inj.c) + '">' + esc(fr[0]) + "</span>";
  }
  function h2hHtml(h, a) {
    var hid = h.info.id, aid = a.info.id, list = [];
    H2H.forEach(function (r) {
      if ((r[2] === hid && r[3] === aid) || (r[2] === aid && r[3] === hid)) list.push({ d: r[1], home: r[2], hs: r[4], as: r[5] });
    });
    data.games.forEach(function (g) {
      if ((g.homeId === hid && g.awayId === aid) || (g.homeId === aid && g.awayId === hid)) list.push({ d: g.date.slice(0, 10), home: g.homeId, hs: g.homeScore, as: g.awayScore });
    });

  // ================= Nos paris =================

      var vals = p.g.map(function (r) { return r[st.i]; });
      var season = avg(vals), last5 = avg(vals.slice(-5)), min5 = avg(mins.slice(-5));
      var sd = Math.sqrt(avg(vals.map(function (v) { return (v - season) * (v - season); })) * vals.length / Math.max(1, vals.length - 1));
      var proj = (0.6 * season + 0.4 * last5) * oppF;
      rows.push({ pid: pid, p: p, season: season, last5: last5, min5: min5, sd: Math.max(sd, st.floor), proj: proj, last10: vals.slice(-10), inj: injuryOf(teamId, pid), gid: g.id, oppF: oppF });
    });
    return rows.sort(function (x, y) { return y.proj - x.proj; });
  }

  function plResultHtml(info) {
    var L = plLines[info.key] || {};
    var line = parseFloat(L.l);
    if (!isFinite(line)) return { hit: "", pct: "", val: '<span class="sub">entre la ligne</span>' };
    var pOver = 1 - normCdf((line - info.proj) / info.sd);
    var hits = info.last10.filter(function (v) { return v > line; }).length;
    var oO = parseFloat(L.o) > 1 ? parseFloat(L.o) : STD_DEC, oU = parseFloat(L.u) > 1 ? parseFloat(L.u) : STD_DEC;
    var evO = pOver * oO - 1, evU = (1 - pOver) * oU - 1;
    var over = evO >= evU, best = over ? "over" : "under";
    return {
      hit: hits + "/" + info.last10.length,
      pct: pct(pOver),
      val: (over ? "Over " : "Under ") + verdict(over ? pOver : 1 - pOver, over ? oO : oU) +
        ' <button type="button" class="addbet" data-g="' + esc(info.gid) + '" data-m="prop" data-pid="' + esc(info.pid) + '" data-stat="' + plStat +
        '" data-pick="' + best + '" data-po="' + pOver + '">＋ Parier</button>'
    };
  }

  function playersHtml() {
    if (!PL) return "<h2>Joueurs</h2>" + '<div class="empty">Les stats des joueurs ne sont pas encore chargées. Elles arrivent au prochain rafraîchissement automatique (<code>node fetch-extras.mjs</code>).</div>';
    var now = Date.now();
    var list = (data.upcoming || []).filter(function (g) { return teams[g.homeId] && teams[g.awayId] && new Date(g.date).getTime() > now; });
    if (!list.length) return "<h2>Joueurs</h2>" + '<div class="empty">Aucun match à venir.</div>';
    if (!list.some(function (g) { return g.id === plGame; })) plGame = list[0].id;
    var g = upcomingById[plGame];
    var fmt = new Intl.DateTimeFormat("fr-CA", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    var head = "<h2>Joueurs</h2>" +
      '<div class="plsel"><select id="plGame">' + list.map(function (x) {
        return '<option value="' + esc(x.id) + '"' + (x.id === plGame ? " selected" : "") + ">" + esc(abbr(x.awayId) + " @ " + abbr(x.homeId) + " · " + fmt.format(new Date(x.date))) + "</option>";
      }).join("") + "</select>" +
      '<select id="plStat">' + Object.keys(STATS).map(function (k) { return '<option value="' + k + '"' + (k === plStat ? " selected" : "") + ">" + STATS[k].label + "</option>"; }).join("") + "</select></div>" +
      '<div class="sub">Entre la ligne du book (ex. 22.5) et ses cotes Over/Under (1.91 par défaut). « 10 dern. » = nombre de matchs au-dessus de la ligne sur les 10 derniers.</div>';
    plInfo = {};
    var body = [[g.awayId, g.homeId], [g.homeId, g.awayId]].map(function (pair) {
      var rows = plRows(g, pair[0], pair[1]);
      if (!rows.length) return "<h2>" + esc(abbr(pair[0])) + "</h2><div class=\"empty\">Pas assez de matchs joués.</div>";
      var oppTxt = STATS[plStat].opp ? " · défense " + esc(abbr(pair[1])) + " : " + (rows[0].oppF >= 1 ? "+" : "") + ((rows[0].oppF - 1) * 100).toFixed(1) + " % de points accordés vs la ligue" : "";
      return "<h2>" + esc(teams[pair[0]].info.name) + '<span class="sub">' + oppTxt + "</span></h2>" +
        '<div class="scroll"><table class="pl"><thead><tr><th>Joueur</th><th>Min (5)</th><th>Saison</th><th>5 dern.</th><th>Proj.</th><th>Ligne</th><th>Cote O</th><th>Cote U</th><th>10 dern.</th><th>Over</th><th>Valeur</th></tr></thead><tbody>' +
        rows.map(function (r) {
          var key = plKey(g.id, r.pid, plStat), L = plLines[key] || {};
          var info = { key: key, proj: r.proj, sd: r.sd, last10: r.last10, gid: g.id, pid: r.pid };
          plInfo[key] = info;
          var out = r.inj && (r.inj.s === "Out" || r.inj.s === "Suspension");
          var res = out ? { hit: "", pct: "", val: '<span class="sub">absent</span>' } : plResultHtml(info);
          var inp = function (f, ph) { return '<input class="plin num" type="number" inputmode="decimal" step="' + (f === "l" ? "0.5" : "0.01") + '" data-k="' + esc(key) + '" data-f="' + f + '" placeholder="' + ph + '" value="' + esc(L[f] || "") + '">'; };
          return '<tr' + (out ? ' class="out"' : "") + ">" +
            '<td class="pname"><b>' + esc(r.p.n) + "</b> <small>" + esc(r.p.pos) + "</small>" + statusTag(r.inj) + "</td>" +
            '<td class="num">' + f1(r.min5) + "</td>" +
            '<td class="num">' + f1(r.season) + "</td>" +
            '<td class="num">' + f1(r.last5) + "</td>" +
            '<td class="num"><b>' + f1(r.proj) + "</b></td>" +
            "<td>" + inp("l", "") + "</td><td>" + inp("o", "1.91") + "</td><td>" + inp("u", "1.91") + "</td>" +
            '<td class="num" data-r="hit" data-k="' + esc(key) + '">' + res.hit + "</td>" +
            '<td class="num" data-r="pct" data-k="' + esc(key) + '">' + res.pct + "</td>" +
            '<td data-r="val" data-k="' + esc(key) + '">' + res.val + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }).join("");
    var note = '<p class="sub">Projection = (60 % moyenne de la saison + 40 % des 5 derniers matchs)' + (STATS[plStat].opp ? " × défense adverse (points accordés vs la moyenne de la ligue)" : "") +
      ". Probabilité Over : loi normale avec l'écart-type du joueur (minimum " + STATS[plStat].floor + "). Ne tient pas compte des minutes changées par une blessure d'un coéquipier : vérifie les blessés avant de parier." +
      (PL.injuriesAt ? " Blessures à jour du " + esc(new Date(PL.injuriesAt).toLocaleString("fr-CA", { dateStyle: "medium", timeStyle: "short" })) + "." : "") + "</p>";
    return head + body + note;
  }
  function renderPlayers() { document.getElementById("view-joueurs").innerHTML = playersHtml(); }

  app.addEventListener("change", function (e) {
    if (e.target.id === "plGame") { plGame = e.target.value; renderPlayers(); }
    else if (e.target.id === "plStat") { plStat = e.target.value; renderPlayers(); }
  });
  app.addEventListener("input", function (e) {
    var el = e.target;
    if (!el.classList || !el.classList.contains("plin")) return;
    var k = el.getAttribute("data-k"), f = el.getAttribute("data-f");
    var L = plLines[k] || (plLines[k] = {});
    if (el.value === "") delete L[f]; else L[f] = el.value;
    if (!Object.keys(L).length) delete plLines[k];
    try { localStorage.setItem(PL_KEY, JSON.stringify(plLines)); } catch (err) {}
    var info = plInfo[k];
    if (!info) return;
    var res = plResultHtml(info);
    ["hit", "pct", "val"].forEach(function (r) {
      var cell = app.querySelector('td[data-r="' + r + '"][data-k="' + k + '"]');
      if (cell) cell.innerHTML = res[r];
    });
  });

  // ---- Menu ----
  var VIEW_KEY = "paris-stats-view";
  var view = "matchs";
  try { view = localStorage.getItem(VIEW_KEY) || "matchs"; } catch (e) {}
  function showView(v) {
    view = ["matchs", "joueurs", "paris", "equipes"].indexOf(v) >= 0 ? v : "matchs";
    ["matchs", "joueurs", "paris", "equipes"].forEach(function (k) { document.getElementById("view-" + k).hidden = k !== view; });
    app.querySelectorAll("nav.menu button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-view") === view); });
    try { localStorage.setItem(VIEW_KEY, view); } catch (e) {}
  }
  renderBets();
  renderPlayers();
  showView(view);

  // ---- Formulaire d'ajout ----
  var modal = document.getElementById("betModal"), draft = null;
  var whoLast = "";
  try { whoLast = localStorage.getItem("paris-stats-who") || ""; } catch (e) {}

  function openBet(btn) {
    var g = upcomingById[btn.getAttribute("data-g")];
    if (!g) return;
    var m = btn.getAttribute("data-m"), pick = btn.getAttribute("data-pick"), o = g.odds || {};
    var h = abbr(g.homeId), a = abbr(g.awayId);
    draft = { gameId: g.id, date: g.date, homeId: g.homeId, awayId: g.awayId, market: m, p: parseFloat(btn.getAttribute("data-p")) || null };
    var sel = document.getElementById("bmPick"), opts;
    if (m === "prop") {
      var pid = btn.getAttribute("data-pid"), st = btn.getAttribute("data-stat"), saved2 = plLines[plKey(g.id, pid, st)] || {};
      var pOver = parseFloat(btn.getAttribute("data-po"));
      draft.playerId = pid; draft.playerName = PL.players[pid].n; draft.stat = st; draft.pOver = pOver;
      draft.oddsOver = parseFloat(saved2.o) || STD_DEC; draft.oddsUnder = parseFloat(saved2.u) || STD_DEC;
      draft.p = pick === "over" ? pOver : 1 - pOver;
      sel.innerHTML = [["over", "Over"], ["under", "Under"]].map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === pick ? " selected" : "") + ">" + x[1] + "</option>"; }).join("");
      document.getElementById("bmTitle").textContent = draft.playerName + " · " + STATS[st].label + " · " + a + " @ " + h;
      document.getElementById("bmLineWrap").hidden = false;
      document.getElementById("bmLine").value = saved2.l || "";
      document.getElementById("bmOdds").value = (pick === "over" ? draft.oddsOver : draft.oddsUnder).toFixed(2);
      fillStake();
      document.getElementById("bmWho").value = whoLast;
      modal.hidden = false;
      document.getElementById("bmStake").focus();
      return;
    }
    if (m === "ml") opts = [["away", a + " gagne"], ["home", h + " gagne"]];
    else if (m === "spread") opts = [["home", h + " (ligne domicile)"], ["away", a + " (ligne visiteur)"]];
    else opts = [["over", "Over"], ["under", "Under"]];
    sel.innerHTML = opts.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === pick ? " selected" : "") + ">" + esc(x[1]) + "</option>"; }).join("");
    document.getElementById("bmTitle").textContent = a + " @ " + h + " · " + { ml: "Moneyline", spread: "Écart", total: "Total" }[m];
    var lineWrap = document.getElementById("bmLineWrap"), lineIn = document.getElementById("bmLine");
    lineWrap.hidden = m === "ml";
    if (m === "spread") lineIn.value = typeof o.spread === "number" ? (pick === "home" ? o.spread : -o.spread) : "";
    else if (m === "total") lineIn.value = typeof o.total === "number" ? o.total : "";
    var odds = STD_DEC;
    if (m === "ml") {
      var inp = app.querySelector('input.odds[data-id="' + btn.getAttribute("data-odds-from") + '"]');
      odds = inp && parseFloat(inp.value) > 1 ? parseFloat(inp.value) : NaN;
    }
    document.getElementById("bmOdds").value = isFinite(odds) ? odds.toFixed(2) : "";
    var dec = parseFloat(document.getElementById("bmOdds").value), stake = "";
    if (bankroll > 0 && draft.p && dec > 1) {
      var b = dec - 1, f = Math.min((b * draft.p - (1 - draft.p)) / b * KELLY_FRAC, MAX_STAKE);
      if (f > 0) stake = Math.max(1, Math.round(f * bankroll));
    }
    document.getElementById("bmStake").value = stake;
    document.getElementById("bmWho").value = whoLast;
    modal.hidden = false;
    document.getElementById("bmOdds").focus();
  }

  function fillStake() {
    var dec = parseFloat(document.getElementById("bmOdds").value), stake = "";
    if (bankroll > 0 && draft.p && dec > 1) {
      var b = dec - 1, f = Math.min((b * draft.p - (1 - draft.p)) / b * KELLY_FRAC, MAX_STAKE);
      if (f > 0) stake = Math.max(1, Math.round(f * bankroll));
    }
    document.getElementById("bmStake").value = stake;
  }
  document.getElementById("bmPick").addEventListener("change", function () {
    if (draft && draft.market === "prop") {
      var over = this.value === "over";
      draft.p = over ? draft.pOver : 1 - draft.pOver;
      document.getElementById("bmOdds").value = (over ? draft.oddsOver : draft.oddsUnder).toFixed(2);
      fillStake();
      return;
    }
    if (draft && draft.market === "spread") { var li = document.getElementById("bmLine"); if (li.value !== "") li.value = -parseFloat(li.value); }
  });
  document.getElementById("bmCancel").addEventListener("click", function () { modal.hidden = true; });
  modal.addEventListener("click", function (e) { if (e.target === modal) modal.hidden = true; });
  document.getElementById("betForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var pick = document.getElementById("bmPick").value;
    var odds = parseFloat(document.getElementById("bmOdds").value), stake = parseFloat(document.getElementById("bmStake").value);
    var who = document.getElementById("bmWho").value.trim();
    if (!(odds > 1) || !(stake > 0) || !who) return;
    var b = Object.assign({}, draft, { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), pick: pick, odds: odds, stake: stake, who: who, createdAt: new Date().toISOString() });
    if (b.market === "prop") { delete b.pOver; delete b.oddsOver; delete b.oddsUnder; }
    if (b.market !== "ml") {
      var lv = parseFloat(document.getElementById("bmLine").value);
      if (!isFinite(lv)) return;
      b.line = b.market === "spread" ? (pick === "home" ? lv : -lv) : lv;
    }
    bets.push(b); saveBets();
    whoLast = who; try { localStorage.setItem("paris-stats-who", who); } catch (err) {}
    modal.hidden = true;
    renderBets();
  });

  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.id === "marge") {
      var mv = parseFloat(el.value);
      if (!isFinite(mv) || mv < 0 || mv > 50) return;
      EV_GOOD = mv / 100; EV_SUSPECT = Math.max(0.15, EV_GOOD + 0.10);
      try { localStorage.setItem("paris-stats-marge", String(mv)); } catch (err) {}
      document.getElementById("upcoming").innerHTML = basisHtml() + upcomingHtml();
      renderPlayers();
      return;
    }
    if (el.id === "bankroll") {
      bankroll = parseFloat(el.value) || 0;
      try { localStorage.setItem("paris-stats-bankroll", String(bankroll)); } catch (err) {}
      document.getElementById("upcoming").innerHTML = basisHtml() + upcomingHtml();
      return;
    }
    if (!el.classList || !el.classList.contains("odds")) return;
    var id = el.getAttribute("data-id");
    if (el.value === "") delete saved[id]; else saved[id] = { v: el.value, t: Date.now() };
    save();
    refresh(el);
  });

  function refresh(el) {
    var id = el.getAttribute("data-id");
    var book = parseFloat(el.getAttribute("data-book"));
    var dec = saved[id] ? parseFloat(saved[id].v) : (el.value === "" ? NaN : book);
    app.querySelector('.ev[data-for="' + id + '"]').innerHTML = verdict(parseFloat(el.getAttribute("data-p")), dec);
    app.querySelector('.src[data-src="' + id + '"]').innerHTML = sourceHtml(id, el.value, isFinite(book), el.getAttribute("data-prov"));
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target : null;
    if (!t) return;
    var nv = t.closest("nav.menu button[data-view]");
    if (nv) { showView(nv.getAttribute("data-view")); return; }
    var ab = t.closest("button.addbet");
    if (ab) { openBet(ab); return; }
    var wb = t.closest("button[data-who]");
    if (wb) { whoFilter = wb.getAttribute("data-who"); renderBets(); return; }
    var del = t.closest("button[data-del]");
    if (del) {
      var did = del.getAttribute("data-del");
      if (del.getAttribute("data-confirm") !== "1") { del.setAttribute("data-confirm", "1"); del.textContent = "Supprimer ?"; return; }
      bets = bets.filter(function (b) { return b.id !== did; }); saveBets(); renderBets(); return;
    }
    if (t.closest("#betExport")) {
      var txt = JSON.stringify(bets);
      var msg = document.getElementById("betMsg");
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { msg.textContent = bets.length + " paris copiés."; }, function () { msg.textContent = "Copie refusée par le navigateur."; });
      return;
    }
    if (t.closest("#betImportOpen")) { document.getElementById("betImportBox").hidden = false; return; }
    if (t.closest("#betImport")) {
      var m2 = document.getElementById("betMsg"), arr;
      try { arr = JSON.parse(document.getElementById("betImportTxt").value); } catch (err) { m2.textContent = "Texte invalide."; return; }
      if (!Array.isArray(arr)) { m2.textContent = "Texte invalide."; return; }
      var have = {}; bets.forEach(function (b) { have[b.id] = true; });
      var added = 0;
      arr.forEach(function (b) {
        if (b && typeof b.id === "string" && !have[b.id] && b.gameId && ["ml", "spread", "total", "prop"].indexOf(b.market) >= 0 && Number.isFinite(b.odds) && b.odds > 1 && Number.isFinite(b.stake) && b.stake > 0 && typeof b.who === "string" && Number.isFinite(Date.parse(b.date)) && (b.market === "total" || b.market === "prop" ? ["over", "under"] : ["home", "away"]).indexOf(b.pick) >= 0 && (b.market === "ml" || Number.isFinite(b.line)) && (b.market !== "prop" || (typeof b.playerId === "string" && !!STATS[b.stat]))) { bets.push(b); have[b.id] = true; added++; }
      });
      saveBets(); renderBets();
      document.getElementById("betMsg").textContent = added + " pari(s) ajouté(s).";
      return;
    }
    var reset = e.target.closest ? e.target.closest("button[data-reset]") : null;
    if (reset) {
      var rid = reset.getAttribute("data-reset");
      var input = app.querySelector('input.odds[data-id="' + rid + '"]');
      var book = parseFloat(input.getAttribute("data-book"));
      delete saved[rid];
      save();
      input.value = isFinite(book) ? book.toFixed(2) : "";
      refresh(input);
      return;
    }
    var pick = e.target.closest ? e.target.closest("button[data-basis]") : null;
    if (pick) {
      basis = pick.getAttribute("data-basis");
      try { localStorage.setItem(BASIS_KEY, basis); } catch (err) {}
      document.getElementById("upcoming").innerHTML = basisHtml() + upcomingHtml();
      return;
    }
    var th = e.target.closest ? e.target.closest("th[data-col]") : null;
    if (!th) return;
    var i = +th.getAttribute("data-col");
    if (i === sortCol) sortDir = -sortDir; else { sortCol = i; sortDir = cols[i].text ? 1 : -1; }
    document.getElementById("table").innerHTML = tableHtml();
  });
})();
</script>
</body>
</html>
