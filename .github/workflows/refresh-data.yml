name: Rafraîchir les données NBA

# Récupère résultats, calendrier et cotes (ESPN) et met à jour data.js.
# Le push sur main déclenche le redéploiement automatique de Render.
on:
  schedule:
    # Heures UTC : 6 h 17, 12 h 17, 16 h 17 et 18 h 47 (heure de l'Est, hiver)
    # → résultats de la veille le matin, cotes fraîches avant les matchs du soir.
    - cron: "17 11,17,21 * * *"
    - cron: "47 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les données ESPN
        run: node fetch-data.mjs
      - name: Stats des joueurs, blessures et face-à-face
        # Si ça échoue, on publie quand même data.js.
        continue-on-error: true
        run: node fetch-extras.mjs
      - name: Publier data.js
        run: |
          if git diff --quiet -- data.js && git diff --quiet -- players.js h2h.js 2>/dev/null && [ -z "$(git ls-files --others --exclude-standard players.js h2h.js)" ]; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          for f in players.js h2h.js; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Données NBA rafraîchies ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase origin main
          git push origin HEAD:main
